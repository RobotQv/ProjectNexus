<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectNexus · 项目交互原型</title>
<style>
:root{
  --nav-bg:#16232f; --nav-bg-2:#1b2b39;
  --nav-fg:#93a6b5; --nav-fg-active:#ffffff;
  --accent:#1d6f74; --accent-hover:#175b60; --accent-soft:#e3f1f1; --accent-line:#bcdcdc;
  --page-bg:#f1f5f7; --card:#ffffff; --line:#e4eaef; --line-soft:#eef2f5;
  --text:#1f2d3a; --text-2:#43596b; --muted:#6b7f8f; --faint:#93a4b3;
  --warn-bg:#fdf3e2; --warn-line:#efd7a6; --warn-fg:#96660e;
  --danger:#b4372f; --danger-soft:#fbeceb; --danger-line:#f0cfcc;
  --ok-soft:#e6f2ee; --ok-fg:#1f6b52;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(23,42,58,.05), 0 6px 18px -12px rgba(23,42,58,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei",sans-serif;
  background:var(--page-bg); color:var(--text); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 骨架 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:212px;flex:0 0 212px;background:var(--nav-bg);color:var(--nav-fg);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 18px}
.brand h1{margin:0;font-size:17px;line-height:1.35;color:#fff;font-weight:700;letter-spacing:.5px}
.brand .sub{
  margin-top:7px;font-size:9.5px;letter-spacing:2.2px;color:#63798c;font-weight:600;
}
.nav{padding:6px 10px;flex:1;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--nav-fg);padding:9px 12px;border-radius:var(--radius-sm);
  font-size:13.5px;margin-bottom:1px;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#dce6ee}
.nav button.on{background:rgba(255,255,255,.1);color:var(--nav-fg-active);font-weight:600}
.nav .ico{width:15px;text-align:center;opacity:.85;font-size:12px}
.sidebar-foot{
  padding:14px 18px 18px;font-size:11px;line-height:1.75;color:#54697b;
  border-top:1px solid rgba(255,255,255,.07);
}
.sidebar-foot b{color:#7d92a4;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:54px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;
}
.crumb{font-size:13px;color:var(--text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{font-weight:600;color:var(--text)}
.crumb .sep{color:var(--faint);margin:0 5px}
.badge{
  font-size:11.5px;padding:4px 9px;border-radius:20px;white-space:nowrap;font-weight:600;
}
.badge-demo{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
.badge-live{background:var(--ok-soft);color:var(--ok-fg);border:1px solid #c6e2d6}
.page{padding:22px;max-width:1180px;width:100%}

.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--text-2)}

/* ---------- 通用 ---------- */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-head .grow{flex:1;min-width:0}
h2.title{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-head{
  padding:13px 16px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.card-head h3{margin:0;font-size:14.5px;font-weight:600;flex:1}
.card-body{padding:16px}
.card-body.tight{padding:0}
.note{font-size:12px;color:var(--muted)}
.hr{height:1px;background:var(--line-soft);border:0;margin:14px 0}

.btn{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:7px 15px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap;
}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{background:#b9c6ce;border-color:#b9c6ce;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--text-2);border-color:var(--line)}
.btn.ghost:hover{background:#f7fafb;border-color:#cfdae2;color:var(--text)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger-line)}
.btn.danger:hover{background:var(--danger-soft);border-color:#e2b5b1}
.btn.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600}
.btn.link:hover{text-decoration:underline}
.btn.link.danger{color:var(--danger)}

.pill{
  display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;
  font-weight:600;white-space:nowrap;border:1px solid transparent;
}
.pill.teal{background:var(--accent-soft);color:#14676c;border-color:var(--accent-line)}
.pill.gray{background:#eef2f5;color:#5f7280;border-color:#dfe7ec}
.pill.done{background:#e9efe8;color:#4a6350;border-color:#d6e0d5}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.pill.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok-fg);border-color:#c6e2d6}

.bar{height:6px;border-radius:4px;background:#e6ecef;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.bar.warn i{background:#c8922c}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--text-2);font-weight:600}
.field .hint{font-size:11.5px;color:var(--faint)}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;
  font-size:13px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(29,111,116,.09)}
textarea{resize:vertical;min-height:62px;line-height:1.6}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;
  background:#f2f6f8;border:1px solid var(--line);color:var(--text-2);
}
.chip b{font-weight:600;color:var(--text)}
.chip button{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:12px}

/* ---------- 统计卡 ---------- */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.stat .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.stat .s{font-size:11.5px;color:var(--faint);margin-top:6px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:12px;color:var(--muted);font-weight:600;
  padding:9px 16px;border-bottom:1px solid var(--line-soft);background:#fafcfd;
}
td{padding:11px 16px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfd}
.tname{font-weight:600}
.tmeta{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.cellprog{display:flex;align-items:center;gap:9px;min-width:150px}
.cellprog span{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:34px}

/* ---------- 需要关注 ---------- */
.alert{border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:var(--info-bg,#f6f8fa)}
.alert+.alert{margin-top:11px}
.alert h4{margin:0 0 6px;font-size:13px;font-weight:700}
.alert p{margin:0 0 8px;font-size:12.5px;line-height:1.7;color:var(--text-2)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.alert.warn h4{color:var(--warn-fg)}
.alert.danger{background:var(--danger-soft);border-color:var(--danger-line)}
.alert.danger h4{color:var(--danger)}
.alert.ok{background:var(--ok-soft);border-color:#c6e2d6}
.alert.ok h4{color:var(--ok-fg)}
.alert:last-child{margin-bottom:0}

/* ---------- 空态 ---------- */
.empty{padding:38px 16px;text-align:center;color:var(--faint);font-size:13px}
.empty .big{font-size:26px;opacity:.5;display:block;margin-bottom:8px}

/* ---------- 对话 ---------- */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%}
.msg.me{align-self:flex-end}
.msg .who{font-size:11.5px;color:var(--faint);margin-bottom:5px;font-weight:600}
.msg.me .who{text-align:right}
.bubble{border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.msg.me .bubble{background:var(--accent-soft);border:1px solid var(--accent-line);color:#124f53}
.msg.ai .bubble{background:#fff;border:1px solid var(--line)}
.cite{
  display:inline-block;font-size:11.5px;background:#eef4f5;border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;cursor:pointer;color:var(--accent);font-weight:600;
  vertical-align:baseline;margin:0 1px;
}
.cite:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.routes{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.composer{display:flex;gap:9px;margin-top:14px}
.composer input{flex:1}

/* ---------- 依赖链 ---------- */
.chain{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 2px 8px}
.node{
  flex:0 0 auto;width:206px;border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;background:#fff;
}
.node.on{border-color:#d9b872;box-shadow:0 0 0 3px rgba(200,146,44,.1)}
.node.dim{background:#fafcfd}
.node .nid{font-size:11px;color:var(--faint);font-family:var(--mono);font-weight:600}
.node .nt{font-size:13.5px;font-weight:600;margin:4px 0 9px;line-height:1.4}
.node .np{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.node .np span{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.node .nn{font-size:11.5px;color:var(--muted)}
.arrow{
  flex:0 0 auto;padding:0 10px;text-align:center;color:var(--faint);font-size:11px;line-height:1.4;
}
.arrow .a{font-size:17px;color:#b8c5ce;display:block}

/* ---------- 弹层 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(19,32,44,.42);display:flex;align-items:center;
  justify-content:center;padding:22px;z-index:100;overflow-y:auto;
}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:660px;box-shadow:0 24px 60px -20px rgba(15,30,45,.4);
  max-height:calc(100vh - 44px);display:flex;flex-direction:column;
}
.modal.wide{max-width:860px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
.modal-head h3{margin:0;font-size:16px;flex:1}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;padding:0 4px}
.x:hover{color:var(--text-2)}

/* ---------- 建议卡 ---------- */
.sg{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sg+.sg{margin-top:14px}
.sg-head{
  padding:11px 14px;background:#fafcfd;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.sg-head .grow{flex:1;min-width:120px}
.sg-body{padding:14px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:13px;align-items:start}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;word-break:break-word}
.src{
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fafcfd;
  font-size:12.5px;margin-top:10px;
}
.src .q{border-left:2px solid var(--accent-line);padding-left:10px;margin:7px 0 0;color:var(--text-2);line-height:1.75}

/* ---------- 提示条 ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:380px}
.toast{
  background:#1f2d3a;color:#fff;padding:11px 15px;border-radius:9px;font-size:13px;
  box-shadow:0 12px 30px -12px rgba(10,25,40,.5);line-height:1.6;animation:sl .2s ease-out;
}
.toast.err{background:#8f2b24}
.toast.ok{background:#1c5f4a}
@keyframes sl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:30px;margin-bottom:12px;font-size:13px;line-height:1.7}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--accent-soft);color:#14676c;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--accent-line);
}
.code{font-family:var(--mono);font-size:12px;background:#f4f7f9;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.scroll-x{overflow-x:auto}

@media(max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
}
@media(max-width:820px){
  .sidebar{
    position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 40px rgba(10,25,40,.35);
  }
  body.drawer .sidebar{transform:none}
  body.drawer::after{content:"";position:fixed;inset:0;background:rgba(19,32,44,.4);z-index:55}
  .menu-btn{display:block}
  .page{padding:15px}
  .grid-4,.grid-2{grid-template-columns:1fr}
  h2.title{font-size:19px}
  .msg{max-width:100%}
  .kv{grid-template-columns:80px minmax(0,1fr)}
  .topbar{padding:0 14px}
  .badge-demo{display:none}
}
</style>
</head>

  <aside class="sidebar">

/* ---------------------------------------------------------------- 依赖规则试算
   仅演示模式使用。正式前端取 POST /projects/{p}/analysis 的 findings，
   不在前端复制判断规则。规则口径对齐开题报告 2.4 与 docs/DATA_CONTRACTS.md。 */
function evaluateDependency(i){
  const gateReached =
    i.gateKind==='start'    ? i.b > 0 :
    i.gateKind==='finish'   ? i.b >= 100 :
                              i.b >= i.gate;

  let status, title, body, tone;
  if(!gateReached){
    status='condition_unmet';
    title='尚未到关卡';
    body = '后置任务当前 '+i.b+'%，还没有到关卡 '+i.gate+'%。'
         + '前置任务尚未满足时先不判定受阻，等后置任务推进到关卡再复核。';
    tone='';
  } else if(i.a >= i.aRequired){
    status='satisfied';
    title='条件已满足';
    body='前置任务当前 '+i.a+'%，已达到要求的 '+i.aRequired+'%，后置任务可以继续推进。';
    tone='ok';
  } else {
    status='blocked_now';
    title='当前关卡受阻';
    body='后置任务已到关卡 '+i.gate+'%，但前置任务当前 '+i.a+'%，未达到要求的 '+i.aRequired+'%。'
       + '当前关卡受阻，需要先推进前置任务或调整关卡。';
    tone='danger';
  }

  let timing, timingText;
  if(!i.neededOn || !i.forecastOn){
    timing='timing_unknown';
    timingText = '时间信息不足：' + (!i.neededOn?'缺少“后置任务需要前置成果的日期”':'缺少“前置任务最新人工预计完成”')
      + '，无法判断时间风险，不等于低风险。';
  } else if(i.forecastOn > i.neededOn){
    timing='future_risk';
    timingText = '前置任务人工预估 '+i.forecastOn+' 完成，晚于后置任务的需要日期 '+i.neededOn
      + '。这是预警，不是确定延期。';
  } else {
    timing='on_time';
    timingText = '前置任务人工预估 '+i.forecastOn+' 完成，不晚于需要日期 '+i.neededOn+'，时间上暂未见冲突。';
  }

  // 结论标题同时体现关卡与时间两类判断，避免“信息不足”被藏进正文当成低风险。
  const parts = [];
  if(timing==='future_risk') parts.push('未来关卡存在风险');
  else if(timing==='timing_unknown') parts.push('时间信息不足');
  if(status==='blocked_now') parts.unshift('当前关卡受阻');
  else if(!parts.length) parts.push(title);
  if(status==='blocked_now') tone='danger';
  else tone = (timing==='future_risk'||timing==='timing_unknown') ? 'warn' : 'ok';

  return { status, timing, title, body, timingText, tone, headline: parts.join(' · ') };
}

/* ---------------------------------------------------------------- 后端调用 */
async function api(path, opts){
  opts = opts || {};
  const base = state.live.baseUrl.replace(/\/+$/,'');
  const headers = { Authorization:'Bearer '+state.live.token };
  const isFile = opts.body instanceof FormData;
  if(opts.body && !isFile) headers['Content-Type']='application/json';
  const res = await fetch(base+path, {
    method: opts.method || 'GET', headers,
    body: opts.body ? (isFile ? opts.body : JSON.stringify(opts.body)) : undefined
  });
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('json') ? await res.json() : await res.blob();
  if(!res.ok){
    const err = new Error((data && data.error && data.error.message) || ('请求失败 '+res.status));
    err.payload = data; err.status = res.status;
    err.requestId = data && data.request_id;
    throw err;
  }
  return data;
}
function apiError(e){
  const code = e.payload && e.payload.error && e.payload.error.code;
  let hint = '';
  if(e.status===401) hint = '登录已失效，请重新登录。';
  else if(e.status===409) hint = '数据已更新，请刷新后重试，不要直接覆盖。';
  else if(e.status===422) hint = '字段或业务规则校验未通过。';
  const rid = e.requestId ? '（请求编号 '+e.requestId+'）' : '';
  toast((e.message||'请求失败')+(hint?(' · '+hint):'')+rid, 'err');
  return code;
}

function renderMessage(m){
  if(m.role==='me'){
    return '<div class="msg me"><div class="who">我</div><div class="bubble">'+esc(m.text)+'</div></div>';
  }
  let body = esc(m.answer);
  if(m.evidence && m.evidence.length){
    // 把 [1] 这类引用渲染成可点击标记
    body = body.replace(/\[(\d+)\]/g, function(all,n){
      return '<span class="cite" data-act="open-source" data-idx="'+(+n-1)+'">['+n+'] 查看原文</span>';
    });
  }
  const outcome = {
    answered:'已依据当前数据回答',
    clarify:'需要澄清目标',
    insufficient:'资料不足',
    partial:'仅部分数据可用'
  }[m.outcome] || '已回答';
  const tone = m.outcome==='answered' ? 'ok' : 'warn';
  return '<div class="msg ai"><div class="who">AI 项目助手</div><div class="bubble">'+body+'</div>'
    + '<div class="row wrap" style="margin-top:9px"><span class="pill '+tone+'">'+outcome+'</span>'
    + '<span class="pill gray">'+esc(m.model_id||'demo')+'</span></div>'
    + (m.warnings&&m.warnings.length
        ? '<div class="alert warn" style="margin-top:10px"><h4>提示</h4><p>'
          + m.warnings.map(esc).join('<br>')+'</p></div>'
        : '')
    + '</div>';
}

document.addEventListener('click', function(ev){
  const nav = ev.target.closest('[data-nav]');
  if(nav){ state.route = nav.dataset.nav; render(); return; }

  const btn = ev.target.closest('[data-act]');
  if(!btn) return;

    case 'go-tasks':       state.route='tasks'; return render();

function doAsk(){
  const input = document.getElementById('askInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;

  const hit = Object.keys(DEMO_ASK).find(k=>text.includes(k));
  const result = deepClone(hit ? DEMO_ASK[hit] : DEMO_ASK['支付']);
  result.facts = (result.facts||[]).map(tid=>taskOf(tid)).filter(Boolean);

  state.chat.candidates = result.candidates || [];
  state.chat.messages.push({ role:'me', text: text });
  state.chat.messages.push(Object.assign({ role:'ai', model_id:'demo-workflow' }, result));
  state.chat.draftInput = '';
  render();
  const box = document.getElementById('chatBox');
  if(box) box.scrollIntoView({block:'nearest'});
}

  state.chat.draftInput = 'TASK-'+id+' 现在进度怎样';

}

function openSource(idx){
  const last = [...state.chat.messages].reverse().find(m=>m.role==='ai' && m.evidence && m.evidence.length);

  const e = last.evidence[idx];
  if(!e) return;
  const blocks = (state.data.blocks[String(e.document_id)] || []);
  openModal('来源原文 · 文档版本 '+e.version,
    '<p class="note">来源：'+esc(e.filename||('文档 '+e.document_id))+' · 定位 '+esc(e.locator||'—')
    + '。引用必须是正文块的连续原文，不是模型摘要。</p>'
    + (blocks.map(b=>'<div class="src"><b>块 '+b.id+' · '+esc(b.heading||'')+'</b>'

function doTaskAsk(){
  const input = document.getElementById('ta-input');
  if(!input) return;

  if(!text) return;
  state.taskChat.messages.push({ role:'me', text: text });

  // 演示：从文本里抽一个标题，其余字段留空等待确认。
  const guess = text.replace(/^(请|帮我|麻烦)?(新增|添加|补|加)(一个|一条)?/, '').replace(/任务$/, '').trim();
  const sid = nextId();
  const draft = {
    id: sid, run_id: nextId(), suggestion_type:'create_task', source_kind:'task_assistant',
    review_status:'draft', submitted_by:1, version:1,
    proposed_payload:{ title: guess.slice(0,60) || '未命名任务', assignee_id:null, module_name:null,
      tags:[], aliases:[], status:'not_started', progress:0, planned_end:null },
    source_refs:[], entity_candidates:[],
    validation_warnings:['未识别出负责人与计划完成日期，请核对后补充。'],
    target_id:null, target_type:null
  };
  state.data.suggestions.push(draft);
  state.taskChat.messages.push({ role:'ai',
    text:'已生成 1 条新建任务草稿，标题为“'+draft.proposed_payload.title+'”。\n\n'
      + '负责人和计划完成日期没有从这句话里识别出来，已留待确认，没有替你编造。'
      + '请核对字段后提交正式审核；提交后进入 pending，仍然不会直接写入任务。' });

  showTaskAssistant();
}

    '<button class="btn ghost" data-act="close-modal">取消</button>'
    + '<button class="btn" data-act="do-upload">上传</button>');

document.addEventListener('click', function(ev){
  const sim = ev.target.closest('[data-act="sim-fail"]');
  if(sim){
    state.simFail = !state.simFail;
    sim.classList.toggle('danger', state.simFail);
    sim.textContent = state.simFail ? '已开启：本次将失败' : '模拟一次失败';
    return;
  }
  const b = ev.target.closest('[data-act="do-upload"]');
  if(!b) return;
  const f = document.getElementById('up-file');
  const name = (f && f.files && f.files[0]) ? f.files[0].name : '新上传资料.txt';
  const type = (document.getElementById('up-type')||{}).value || '会议纪要';
  const date = (document.getElementById('up-date')||{}).value || null;
  const size = (f && f.files && f.files[0]) ? f.files[0].size : 2048;

  const doc = { id: nextId(), filename: name, document_type: type, document_date: date,
    version:1, size_bytes:size, parse_status:'pending', index_status:'pending',
    index_version:null, chunk_count:null, error_message:null, created_by_demo:true };
  state.data.documents.push(doc);

  const jobId = nextId();
  const willFail = !!state.simFail;
  state.simFail = false;
  state.jobs[jobId] = { id:jobId, kind:'document_ingest', status:'queued',
    resource_id:doc.id, attempts:0, error_message:null };

  closeModal(); state.route='documents'; render();
  toast('已上传，返回 202 与 job_id='+jobId+'（排队中）');

  let step = 0;
  const timer = setInterval(()=>{
    step++;
    if(state.route!=='documents'){ clearInterval(timer); return; }   // 离开页面停止轮询
    if(step===1){
      state.jobs[jobId].status = 'running';
      doc.parse_status = 'running'; doc.index_status = 'pending';
    } else if(step===2){
      if(willFail){
        clearInterval(timer);
        state.jobs[jobId].status = 'failed';
        state.jobs[jobId].attempts = 1;
        state.jobs[jobId].error_message = '正文提取失败：该 PDF 无可提取文本层';
        doc.parse_status = 'failed';
        doc.error_message = '正文提取失败：该 PDF 无可提取文本层';
        render();
        toast('后台任务失败：正文提取失败。可点击“重试入库”。','err');
        return;
      }
      state.jobs[jobId].status = 'succeeded';
      doc.parse_status = 'ready';
      doc.index_status = 'running';
      doc.chunk_count = 6;
    } else {
      clearInterval(timer);
      doc.index_status = 'ready';
      doc.index_version = 'idx-'+today().replace(/-/g,'');
      toast('解析与索引均已就绪，可以提问了','ok');
    }
    render();
  }, 1200);
});

function doRetry(id){
  const doc = state.data.documents.find(d=>d.id===id);
  if(!doc) return;
  doc.parse_status='pending'; doc.index_status='pending'; doc.error_message=null;
  render();
  const jobId = nextId();
  state.jobs[jobId] = { id:jobId, kind:'document_ingest', status:'queued', resource_id:id, attempts:1 };
  toast('已重新排队，job_id='+jobId);
  let step = 0;
  const timer = setInterval(()=>{
    step++;
    if(state.route!=='documents'){ clearInterval(timer); return; }
    if(step===1){ doc.parse_status='running'; state.jobs[jobId].status='running'; }
    else{
      clearInterval(timer);
      state.jobs[jobId].status='succeeded';
      doc.parse_status='ready'; doc.index_status='ready';
      doc.chunk_count = doc.chunk_count || 6;
      doc.index_version = 'idx-'+today().replace(/-/g,'');
      toast('重试成功，解析与索引均已就绪','ok');
    }
    render();
  }, 1200);
}

function doConfirm(id){
  const s = state.data.suggestions.find(x=>x.id===id);
  if(!s) return;

  // 重复点击返回同一目标，不重复创建。
  if(s.review_status==='approved'){
    return toast('该建议已通过，目标仍是 '+s.target_type+' #'+s.target_id+'，未重复创建','ok');
  }
  if(s.review_status!=='pending') return toast('该建议已处理','err');

  const read = (k,f)=>{ const el=document.getElementById(k); return el?el.value.trim():f; };
  const title = read('sug-title-'+id, s.proposed_payload.title);
  if(!title) return toast('任务标题不能为空，不能直接通过','err');
  const assignee = read('sug-assignee-'+id,'');

  const merged = Object.assign({}, s.proposed_payload, {
    title: title,
    description: read('sug-desc-'+id, s.proposed_payload.description||'')||null,
    assignee_id: assignee?Number(assignee):null,
    module_name: read('sug-module-'+id,'')||null,
    planned_end: read('sug-planned-'+id,'')||null
  });

  // 正式创建目标
  if(s.suggestion_type==='create_task'){
    const task = Object.assign({ id: nextId(), version:1, tags:[], aliases:[],
      status:'not_started', progress:0, planned_start:null, forecast_end:null, deadline:null,
      source_suggestion_id: s.id }, merged);
    state.data.tasks.push(task);
    s.target_type='task'; s.target_id=task.id;
  }
  s.review_status='approved';
  s.reviewed_by_name='示例成员甲';
  s.reviewed_at=today()+' 11:02';
  s.version += 1;

  render();
  showConfirmResult(s);
}

    '<button class="btn ghost" data-act="close-modal">取消</button>'
    + '<button class="btn danger" data-act="do-reject" data-id="'+id+'">确认驳回</button>');
}
document.addEventListener('click', function(ev){
  const b = ev.target.closest('[data-act="do-reject"]');
  if(!b) return;
  const s = state.data.suggestions.find(x=>x.id===Number(b.dataset.id));
  if(!s) return;
  s.review_status='rejected';
  s.review_note=(document.getElementById('rj-note')||{}).value||'';
  s.reviewed_by_name='示例成员甲';
  s.reviewed_at=today()+' 11:05';
  s.version += 1;
  closeModal(); render();
  toast('已驳回，未创建任何正式任务','ok');
});

function openSugSource(id, idx){
  const s = state.data.suggestions.find(x=>x.id===id);
  if(!s || !s.source_refs[idx]) return;
  const r = s.source_refs[idx];
  const doc = state.data.documents.find(d=>d.id===r.document_id);
  const blocks = (state.data.blocks[String(r.document_id)]||[])
    .filter(b=>r.block_ids.includes(b.id));
  openModal('来源原文 · 建议 #'+id,
    '<p class="note">'+esc(doc?doc.filename:('文档 '+r.document_id))+' · 文档版本 '+r.version
    + ' · 引用块 '+r.block_ids.join(', ')+'。quote 必须是正文块的连续原文，后端逐条核验。</p>'
    + (blocks.length
        ? blocks.map(b=>'<div class="src"><b>块 '+b.id+' · '+esc(b.heading||'')+'</b>'
            +'<p class="q">'+esc(b.text)+'</p></div>').join('')
        : '<div class="src"><p class="q">'+esc(r.quote)+'</p></div>')
    + '<p class="note" style="margin-top:12px">正式前端调用 '
    + '<span class="code">GET /projects/{p}/suggestions/{id}/source</span>；'
    + '原文件用 <span class="code">response.blob()</span> 带 Authorization 下载。</p>', 'wide');
}

/* ---------------------------------------------------------- 依赖输入 */
function applyDeps(){
  const g = k => document.getElementById(k);
  state.deps.a = clamp(g('dep-a') ? g('dep-a').value : state.deps.a);
  state.deps.b = clamp(g('dep-b') ? g('dep-b').value : state.deps.b);
  state.deps.gate = clamp(g('dep-gate') ? g('dep-gate').value : state.deps.gate);
  state.deps.neededOn = g('dep-needed') ? g('dep-needed').value : state.deps.neededOn;
  state.deps.forecastOn = g('dep-forecast') ? g('dep-forecast').value : state.deps.forecastOn;

  const a = taskOf(17), b = taskOf(18);
  if(a) a.progress = state.deps.a;
  if(b) b.progress = state.deps.b;
  const d = state.data.dependencies.find(x=>x.id===31);
  if(d){ d.successor_gate_progress = state.deps.gate; d.gate_needed_on = state.deps.neededOn || null; }
  const r = evaluateDependency(state.deps);
  render();
  toast(r.headline, r.status==='blocked_now' ? 'err' : '');
}
function clamp(v){ const n = parseInt(v,10); return isNaN(n) ? 0 : Math.max(0, Math.min(100, n)); }

function doClearForecast(){
  state.deps.forecastOn = '';
  const d = state.data.dependencies.find(x=>x.id===31);
  if(d) d.predecessor_forecast_ready_on = null;
  const t = taskOf(17);
  if(t) t.forecast_end = null;
  render();
  toast('已清空 A 的最新人工预计完成：时间信息不足，不等于低风险','err');
}

/* ---------------------------------------------------------- 数据源 / 登录 */
function showSourceDialog(){
  openModal('数据源', ''
    + '<p class="note">原型默认使用内置示例数据。切到本机后端后，页面改为调用真实接口；'
    + 'AI 相关能力需要后端开启 demo 模块并启动 Worker，并展示 DEMO 标识。</p>'
    + '<div class="row" style="margin-top:14px">'
    + '<button class="btn'+(state.source==='demo'?'':' ghost')+'" data-act="pick-demo">使用演示数据</button>'
    + '<button class="btn'+(state.source==='live'?'':' ghost')+'" data-act="pick-live">连接本机后端</button>'
    + '</div>'
    + '<div class="hr"></div>'
    + '<p class="note">当前：'+(isLive()
        ? ('已连接 '+esc(state.live.baseUrl)+' · 项目 #'+esc(state.live.projectId||'—'))
        : '内置演示数据')+'</p>'

    + '也不提交到代码仓库。</p>',
    '<button class="btn ghost" data-act="close-modal">关闭</button>');
}
document.addEventListener('click', function(ev){
  const d = ev.target.closest('[data-act="pick-demo"],[data-act="pick-live"]');
  if(!d) return;
  if(d.dataset.act==='pick-demo'){
    state.source='demo'; state.live.token='';
    closeModal(); render(); toast('已切回演示数据');
  }else{
    state.source='live';
    closeModal(); render();
  }
});

async function doLogin(){
  const g = k => (document.getElementById(k)||{}).value || '';
  state.live.baseUrl = g('lg-base').replace(/\/+$/,'') || state.live.baseUrl;
  const name = g('lg-name').trim(), pass = g('lg-pass');
  if(!name || !pass) return toast('请填写登录名与密码','err');
  try{
    const out = await api('/auth/login', { method:'POST', body:{ login_name:name, password:pass } });
    state.live.token = out.access_token;
    state.live.liveUser = out.user.display_name;
    toast('登录成功：'+out.user.display_name,'ok');
    await loadLive();
  }catch(e){
    state.live.token='';
    apiError(e);
    render();
    return;
  }
  render();
}

let livePoller = null;
async function loadLive(){
  try{
    const projects = await api('/projects');
    if(!projects.items.length) return toast('该账号还没有项目，请先创建测试项目','err');
    state.live.projectId = projects.items[0].id;
    const pid = state.live.projectId;
    const [tasks, docs, sugs, deps, members] = await Promise.all([
      api('/projects/'+pid+'/tasks?limit=200'),
      api('/projects/'+pid+'/documents?limit=200'),
      api('/projects/'+pid+'/suggestions?limit=200'),
      api('/projects/'+pid+'/dependencies?limit=500'),
      api('/projects/'+pid+'/members')
    ]);
    state.data.project = projects.items[0];
    state.data.tasks = tasks.items;
    state.data.documents = docs.items;
    state.data.suggestions = sugs.items;
    state.data.dependencies = deps.items;
    state.data.members = members.items;
    toast('已载入项目：'+projects.items[0].name,'ok');
  }catch(e){
    apiError(e);
  }
}

function openModal(title, bodyHtml, footerHtml, size){

    '<div class="mask" data-act="mask-close"><div class="modal '+(size||'')+'">'
    + '<div class="modal-head"><h3>'+esc(title)+'</h3>'
    + '<button class="x" data-act="close-modal" aria-label="关闭">×</button></div>'
    + '<div class="modal-body">'+bodyHtml+'</div>'
    + (footerHtml?('<div class="modal-foot">'+footerHtml+'</div>'):'')
    + '</div></div>';
}
function closeModal(){ document.getElementById('modals').innerHTML=''; }
document.addEventListener('click', function(ev){

});
