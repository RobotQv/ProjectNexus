[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-nexus-backend"
version = "0.1.0"
description = "企业项目智能协作平台 — FastAPI 后端主干"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "PyJWT>=2.10,<3", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
nexus = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "shared*", "team_modules*"]

[tool.pytest.ini_options]
testpaths = ["tests", "team_modules"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
